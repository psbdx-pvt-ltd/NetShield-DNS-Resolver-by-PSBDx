name: Docs Suggester (Demo)

# Suggests wiki pages for a new issue, in two separate jobs so the reply is never slow:
#
#   suggest      (about 10 s)  keyword matching on the wiki API, posts the plain suggestion.
#                              No model. The existing issue-filter job is not touched.
#   personalize  (slower)      a very small open AI model writes ONE intro line; the plain
#                              comment is then edited to include it. Links are always made by
#                              code, the model output is checked by strict rules, and any
#                              failure simply leaves the plain comment as it is.
#
# Triggers
#   push (branch demo/docs-suggester)  tests + live check; runs ALL three models to compare them
#   workflow_dispatch                  same, with your own title/body/feed (default branch only)
#   issues opened                      real comments; ONE model (repo variable AI_MODEL)
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Issue title to test with"
        default: "Getting UnknownHostException on mobile data"
      body:
        description: "Issue body to test with"
        default: "Android 14. The app shows EAI_NODATA and nothing resolves when I use mobile data."
      feed_url:
        description: "Wiki API, RSS or Atom URL (https only)"
        default: "https://wiki.psbdx.com/api/v1/posts"
  push:
    branches: ["demo/docs-suggester"]
    paths:
      - "docs-suggester/**"
      - ".github/workflows/docs-suggester-demo.yml"
  issues:
    types: [opened]

concurrency:
  group: docs-suggester-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  suggest:
    name: Suggest docs (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    outputs:
      status: ${{ steps.suggest.outputs.status }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs-suggester

      - name: Unit tests (offline, no model)
        if: github.event_name != 'issues'   # skipped for real issues to stay fast
        run: node --version && node --test docs-suggester/suggest.test.js docs-suggester/intro.test.js

      - name: Suggest docs
        id: suggest
        # Issue text goes in through env vars only, never into the shell script.
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || inputs.title || 'Getting UnknownHostException on mobile data' }}
          ISSUE_BODY: ${{ github.event.issue.body || inputs.body || 'Android 14. The app shows EAI_NODATA and nothing resolves when I use mobile data.' }}
          ISSUE_USER: ${{ github.event.issue.user.login || github.actor }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          FEED_URL: ${{ inputs.feed_url || vars.DOCS_FEED_URL || 'https://wiki.psbdx.com/api/v1/posts' }}
        run: |
          node docs-suggester/suggest.js --json-out result.json --md-out comment.md --summary "$GITHUB_STEP_SUMMARY"
          echo "status=$(node -p "try{require('./result.json').status}catch(e){'skipped'}")" >> "$GITHUB_OUTPUT"

      - name: Keep the suggestion for the AI job
        uses: actions/upload-artifact@v4
        with:
          name: docs-suggestion
          path: |
            result.json
            comment.md
          if-no-files-found: ignore
          retention-days: 1

      - name: Post the plain suggestion (real issues only)
        if: github.event_name == 'issues' && hashFiles('comment.md') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("comment.md", "utf8");
            const marker = "<!-- netshield-bot:docs -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            if (comments.some((c) => c.body && c.body.includes(marker))) {
              core.info("Docs suggestion already posted, skipping.");
              return;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

  personalize:
    name: AI intro (${{ matrix.model }})
    needs: suggest
    if: needs.suggest.outputs.status == 'ok'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # real issues: one model (repo variable AI_MODEL); demo runs: all three, to compare
        model: ${{ fromJSON(github.event_name == 'issues' && format('["{0}"]', vars.AI_MODEL || 'HuggingFaceTB/SmolLM2-360M-Instruct') || '["HuggingFaceTB/SmolLM2-135M-Instruct","HuggingFaceTB/SmolLM2-360M-Instruct","onnx-community/Qwen2.5-0.5B-Instruct"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs-suggester

      - uses: actions/download-artifact@v4
        with:
          name: docs-suggestion
          path: suggestion

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-transformers-3.8.1-${{ runner.os }}

      - name: Cache model files
        uses: actions/cache@v4
        with:
          path: docs-suggester/.hf-cache
          key: hf-${{ matrix.model }}-q8-v1

      - name: Install the model runtime
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip   # CPU only; do not download GPU libraries
        run: |
          start=$SECONDS
          npm install --prefix docs-suggester --no-save --no-audit --no-fund @huggingface/transformers@3.8.1
          echo "npm install: $((SECONDS-start)) s, node_modules $(du -sh docs-suggester/node_modules | cut -f1)"
          {
            echo "### 📦 Runtime install"
            echo "npm install took **$((SECONDS-start)) s**, node_modules is **$(du -sh docs-suggester/node_modules | cut -f1)**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the intro with the small model
        env:
          ISSUE_TITLE: ${{ github.event.issue.title || inputs.title || 'Getting UnknownHostException on mobile data' }}
          ISSUE_BODY: ${{ github.event.issue.body || inputs.body || 'Android 14. The app shows EAI_NODATA and nothing resolves when I use mobile data.' }}
          ISSUE_USER: ${{ github.event.issue.user.login || github.actor }}
          AI_MODEL: ${{ matrix.model }}
          AI_DTYPE: q8
          HF_CACHE_DIR: ${{ github.workspace }}/docs-suggester/.hf-cache
        run: node docs-suggester/personalize.mjs suggestion/result.json --out ai.json --md-out comment-ai.md --summary "$GITHUB_STEP_SUMMARY"

      - name: Compare on 9 sample issues (demo runs only)
        if: github.event_name != 'issues'
        env:
          AI_MODEL: ${{ matrix.model }}
          AI_DTYPE: q8
          HF_CACHE_DIR: ${{ github.workspace }}/docs-suggester/.hf-cache
        run: node docs-suggester/eval.mjs docs-suggester/eval-issues.json --summary "$GITHUB_STEP_SUMMARY"

      - name: Replace the plain comment with the AI version (real issues only)
        if: github.event_name == 'issues' && hashFiles('comment-ai.md') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("comment-ai.md", "utf8");
            const marker = "<!-- netshield-bot:docs -->";
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.body && c.body.includes(marker));
            if (!mine) { core.info("No plain comment to replace, leaving it."); return; }
            await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
